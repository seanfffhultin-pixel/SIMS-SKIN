<!doctype html><html><head><meta charset="utf-8"><title>SIMS skin browser checks</title><link rel="stylesheet" href="../public/sims-skin/shsb-sims.css"></head>
<body ng-app="studentApp" ng-controller="IndexCtrl">
<div id="homeworkItems"><div class="view-body"><div class="scroll-container">
<div class="homeworkItems-item" id="one" ng-click="homework.show(item)"><table><tr><td class="homeworkItems-item-description"><span class="homeworkItems-item-desc">Essay</span></td></tr></table></div>
<div class="homeworkItems-item" id="two" ng-click="homework.show(item)"><table><tr><td class="homeworkItems-item-description"><span class="homeworkItems-item-desc">Essay</span></td></tr></table></div>
<div class="homeworkItems-item" id="missing" ng-click="homework.show(item)"><table><tr><td class="homeworkItems-item-description">Unavailable ID</td></tr></table></div>
</div></div></div>
<div id="homework"><div class="view-body"><div class="homeworkDetailItem" id="detail"><div class="homework-detail-header-panel"><div class="header">Essay</div></div></div></div></div>
<homework-homepage-widget><div class="homework-homepage-widget-item" id="home" ng-click="homework.show(hwk)"><span class="homepage-widget-title">Essay</span></div></homework-homepage-widget>
<pre id="results">RUNNING</pre>
<script src="../skin/homework.js"></script>
<script>
(async()=>{
 const output=document.querySelector('#results'), results=[];
 const assert=(ok,name)=>{if(!ok)throw new Error(name);results.push(name)};
 const wait=()=>new Promise(r=>setTimeout(r,180));
 const input=id=>document.querySelector('#'+id+' .shsb-completion input');
 const scopes=new Map();const rowScope=(id,student='student-a')=>({item:{HomeworkId:id,Title:'Essay'},homework:{studentId:student}});
 scopes.set(document.querySelector('#one'),rowScope('assignment-a'));
 scopes.set(document.querySelector('#two'),rowScope('assignment-b'));
 scopes.set(document.querySelector('#missing'),{item:{Title:'Essay'}});
 scopes.set(document.querySelector('#detail'),{vm:{homeworkId:'assignment-a',studentId:'student-a',item:{Title:'Essay'}}});
 scopes.set(document.querySelector('#home'),{hwk:{HomeworkId:'assignment-a',StudentId:'student-a'}});
 let failWrites=false,navClicks=0;
 const env={location:window.location,angular:{element:el=>({scope:()=>scopes.get(el)})},MutationObserver,
 localStorage:{getItem:k=>localStorage.getItem(k),setItem:(k,v)=>{if(failWrites)throw Error('Quota');localStorage.setItem(k,v)}},
 setTimeout:window.setTimeout.bind(window),clearTimeout:window.clearTimeout.bind(window),setInterval:window.setInterval.bind(window),clearInterval:window.clearInterval.bind(window),addEventListener:window.addEventListener.bind(window)};
 const key='shsb-sims:completed:v1:'+JSON.stringify(['test-school','student-a','assignment-a']);
 try {
  location.hash='!/schools/test-school/homeworkItems';
  const reloadPhase=sessionStorage.getItem('shsb-fixture-reload')==='yes';
  if(!reloadPhase){for(const k of Object.keys(localStorage))if(k.startsWith('shsb-sims:completed:v1:'))localStorage.removeItem(k)}
  startSimsSkin(env,document);
  if(reloadPhase){
   assert(input('one').checked,'saved tick survives page reload');sessionStorage.removeItem('shsb-fixture-reload');
   input('one').click();assert(!input('detail').checked&&!input('home').checked,'untick propagates to other views');
  }else{
   assert(document.querySelectorAll('.shsb-completion').length===5,'one control per assignment view');
   startSimsSkin(env,document);assert(document.querySelectorAll('.shsb-completion').length===5,'duplicate installation does not duplicate controls');
   assert(input('missing').disabled,'missing IDs disable ticking');
   document.querySelector('#one').addEventListener('click',()=>navClicks++);
   document.querySelector('#one label').click();
   assert(input('one').checked&&localStorage.getItem(key)==='true','label click saves completion');
   assert(navClicks===0,'checkbox does not trigger SIMS navigation');
   assert(!input('two').checked,'identical titles retain separate completion');
   assert(input('home').checked&&input('detail').checked,'completion shared by list, dashboard and detail');
   assert(getComputedStyle(document.querySelector('#one')).display==='none','completed task hidden from To do');
   assert(getComputedStyle(document.querySelector('#home')).display==='none','dashboard hides completed task');
   assert(getComputedStyle(document.querySelector('#detail')).display!=='none','open detail remains accessible');
   document.querySelector('#homeworkItems [data-shsb-view="done"]').click();
   assert(getComputedStyle(document.querySelector('#one')).display!=='none','Done section reveals completed task');
   assert(getComputedStyle(document.querySelector('#two')).display==='none','Done section excludes incomplete task');
   input('one').click();
   assert(getComputedStyle(document.querySelector('#one')).display==='none','unticking removes task from Done');
   document.querySelector('#homeworkItems [data-shsb-view="todo"]').click();
   assert(getComputedStyle(document.querySelector('#one')).display!=='none','unticked task returns to To do');
   input('one').click();
   failWrites=true;input('one').click();assert(input('one').checked,'failed save restores previous tick');
   assert(document.querySelector('#shsb-personal-note').textContent.includes('not saved'),'storage error shown');failWrites=false;
   scopes.set(document.querySelector('#one'),rowScope('assignment-a','student-b'));
   window.dispatchEvent(new HashChangeEvent('hashchange'));await wait();assert(!input('one').checked,'student identity isolates ticks');
   scopes.set(document.querySelector('#one'),rowScope('assignment-a'));location.hash='!/schools/other-school/homeworkItems';await wait();assert(!input('one').checked,'school identity isolates ticks');
   location.hash='!/schools/test-school/homeworkItems';await wait();assert(input('one').checked,'returning to original school restores tick');
   const dynamic=document.querySelector('#two').cloneNode(true);dynamic.id='dynamic';dynamic.querySelector('label').remove();scopes.set(dynamic,rowScope('assignment-new'));document.querySelector('#two').after(dynamic);await wait();assert(input('dynamic')&&!input('dynamic').checked,'new rows get independent controls');
   sessionStorage.setItem('shsb-fixture-results',JSON.stringify(results));sessionStorage.setItem('shsb-fixture-reload','yes');location.reload();return;
  }
  output.textContent='PASS '+JSON.stringify([...JSON.parse(sessionStorage.getItem('shsb-fixture-results')||'[]'),...results]);
 }catch(e){sessionStorage.removeItem('shsb-fixture-reload');output.textContent='FAIL '+e.message+'; passed='+JSON.stringify(results)}
})();
</script></body></html>
